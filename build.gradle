dependencies {
    if(providers.gradleProperty('shaderParticleTests').getOrElse('false')=='true') {
        gameTestRuntimeOnly fileTree(dir: '.dev/shader-test-mods', include: ['iris*.jar'])
        gameTestRuntimeOnly fileTree(dir: '.dev/shader-merged', include: ['*.jar'])
        gameTestRuntimeOnly fileTree(dir: '.dev/shader-runtime', include: ['fabric*.jar'])
    }
    // Downloaded from the official Modrinth release pages, pinned by SHA-512.
    implementation files('.dev/mods/sable-neoforge-1.21.1-2.0.5.jar')
    compileOnly fileTree(dir: '.dev/compile-libs', include: ['*.jar'])
    compileOnly files('.dev/mods/create-1.21.1-6.0.10.jar')
    compileOnly files('.dev/epicfight/epic-fight-21.17.3.1-mc1.21.1-neoforge.jar')
    compileOnly files('.dev/iron-spells-review/irons_spellbooks-1.21.1-3.16.3.jar')
    compileOnly fileTree(dir: '.dev/iron-spells-testmods', include: ['*.jar'])
    if (providers.gradleProperty('ironSpellRuntime').getOrElse('false') == 'true') {
        runtimeOnly files('.dev/iron-spells-review/irons_spellbooks-1.21.1-3.16.3.jar')
        runtimeOnly fileTree(dir: '.dev/iron-spells-testmods', include: ['*.jar'])
    }
    if (providers.gradleProperty('ironSpellTests').getOrElse('false') == 'true') {
        gameTestRuntimeOnly files('.dev/iron-spells-review/irons_spellbooks-1.21.1-3.16.3.jar')
        gameTestRuntimeOnly fileTree(dir: '.dev/iron-spells-testmods', include: ['*.jar'])
    }
    if(providers.gradleProperty('mountedCleanupTests').getOrElse('false')=='true') gameTestRuntimeOnly fileTree(dir: '.dev/mounted-cleanup-mods', include: ['*.jar'])
    if(providers.gradleProperty('plotCacheCompatTests').getOrElse('false')=='true') gameTestRuntimeOnly files('.dev/cache223/c2me.jar')
    if(providers.gradleProperty('dragonToolgunTests').getOrElse('false')=='true') gameTestRuntimeOnly files('.dev/dragon-toolgun.jar')
    if(providers.gradleProperty('dragonReplayTests').getOrElse('false')=='true') gameTestRuntimeOnly fileTree(dir: '.dev/dragon-replay-mods', include: ['*.jar'])
    if(providers.gradleProperty('arenaAddonTests').getOrElse('false')=='true') gameTestRuntimeOnly fileTree(dir: '.dev/arena-addon-mods', include: ['*.jar'])
    if (providers.gradleProperty('cleanupCompatTests').getOrElse('false') == 'true') gameTestRuntimeOnly fileTree(dir: '.dev/cleanup-mods', include: ['*.jar'])
    if (providers.gradleProperty('epicFightTests').getOrElse('false') == 'true') gameTestRuntimeOnly files('.dev/epicfight/epic-fight-21.17.3.1-mc1.21.1-neoforge.jar')
    runtimeOnly files('.dev/mods/create-1.21.1-6.0.10.jar')
    runtimeOnly files('.dev/mods/create-aeronautics-bundled-1.21.1-1.3.2.jar')
    runtimeOnly files('.dev/mods/Jade-1.21.1-NeoForge-15.10.6.jar')
    if(providers.gradleProperty('photomancyRuntime').getOrElse('true')=='true') runtimeOnly files('.dev/mods/sable-photomancy-1.0.1.jar')
    runtimeOnly files('.dev/mods/ldlib2-neoforge-1.21.1-2.2.17-all.jar')
    if (providers.gradleProperty('weaponCompatTests').getOrElse('false') == 'true') gameTestRuntimeOnly fileTree(dir: '.dev/test-mods', include: ['*.jar'])
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.ow2.asm:asm-tree:9.8'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test', Test) { useJUnitPlatform() }
tasks.named('processResources', ProcessResources) {
    def metadata = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, neo_version: neo_version]
    inputs.properties metadata
    filesMatching('META-INF/neoforge.mods.toml') { expand metadata }
}
idea { module { downloadSources = true } }
