plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
tasks.named('jar', Jar) {
    archiveFileName = "${mod_id}-neoforge-${minecraft_version}-v${mod_version}.jar"
}
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories { mavenCentral() }

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    exampleAddon {
        java.srcDir('examples/module-addon/src/main/java')
        resources.srcDir('examples/module-addon/src/main/resources')
    }
}
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gameTest
    addModdingDependenciesTo sourceSets.exampleAddon
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
        sablelife_tests { sourceSet(sourceSets.gameTest) }
    }
    runs {
        client {
            client()
            loadedMods = [mods.sablelife]
            gameDirectory = file('runs/client')
            programArguments.addAll '--width', '1280', '--height', '720'
        }
        server {
            server()
            loadedMods = [mods.sablelife]
            gameDirectory = file('runs/server')
            programArgument '--nogui'
        }
        wildMsptServer {
            server()
            sourceSet = sourceSets.gameTest
            loadedMods = [mods.sablelife, mods.sablelife_tests]
            gameDirectory = file(providers.gradleProperty('msptDirectory').getOrElse('runs/wild-mspt'))
            systemProperty 'sablelife.wildMspt', 'true'
            jvmArguments.addAll '-Xms1G', '-Xmx3G'
            programArgument '--nogui'
        }
        autonomousMsptServer {
            server()
            sourceSet = sourceSets.gameTest
            loadedMods = [mods.sablelife, mods.sablelife_tests]
            gameDirectory = file(providers.gradleProperty('autonomousDirectory').getOrElse('runs/autonomous-mspt-01'))
            systemProperty 'sablelife.autonomousMspt', 'true'
            systemProperty 'sablelife.autonomousPopulations', providers.gradleProperty('autonomousPopulations').getOrElse('2,8,16,32,64')
            jvmArguments.addAll '-Xms2G', '-Xmx8G'
            programArgument '--nogui'
        }
        wildLifecycleServer {
            server()
            sourceSet = sourceSets.gameTest
            loadedMods = [mods.sablelife, mods.sablelife_tests]
            gameDirectory = file(providers.gradleProperty('lifecycleDirectory').getOrElse('runs/wild-lifecycle-isolated'))
            systemProperty 'sablelife.wildLifecycle', 'true'
            systemProperty 'sablelife.wildLifecycleStage', providers.gradleProperty('lifecycleStage').getOrElse('prepare')
            jvmArguments.addAll '-Xms1G', '-Xmx3G'
            programArgument '--nogui'
        }
        workbenchBenchmarkServer {
