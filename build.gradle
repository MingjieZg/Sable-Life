            programArguments.addAll '--width', '1280', '--height', '720'
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            loadedMods = [mods.sablelife, mods.sablelife_tests]
            gameDirectory = file(providers.gradleProperty('gameTestDirectory').getOrElse('runs/gametest'))
            systemProperty 'sablelife.localGameTests', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('gameTestNamespaces').getOrElse('sablelife_tests')
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
}

dependencies {
    // Downloaded from the official Modrinth release pages, pinned by SHA-512.
    implementation files('.dev/mods/sable-neoforge-1.21.1-2.0.5.jar')
    compileOnly fileTree(dir: '.dev/compile-libs', include: ['*.jar'])
    compileOnly files('.dev/mods/create-1.21.1-6.0.10.jar')
    runtimeOnly files('.dev/mods/create-1.21.1-6.0.10.jar')
    runtimeOnly files('.dev/mods/create-aeronautics-bundled-1.21.1-1.3.2.jar')
    runtimeOnly files('.dev/mods/Jade-1.21.1-NeoForge-15.10.6.jar')
    runtimeOnly files('.dev/mods/sable-photomancy-1.0.1.jar')
    runtimeOnly files('.dev/mods/ldlib2-neoforge-1.21.1-2.2.17-all.jar')
    if (providers.gradleProperty('weaponCompatTests').getOrElse('false') == 'true') gameTestRuntimeOnly fileTree(dir: '.dev/test-mods', include: ['*.jar'])
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test', Test) { useJUnitPlatform() }
tasks.named('processResources', ProcessResources) {
    def metadata = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, neo_version: neo_version]
    inputs.properties metadata
    filesMatching('META-INF/neoforge.mods.toml') { expand metadata }
}
idea { module { downloadSources = true } }
