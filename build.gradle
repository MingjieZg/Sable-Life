plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories { mavenCentral() }

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gameTest
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
        sablelife_tests { sourceSet(sourceSets.gameTest) }
    }
    runs {
        client {
            client()
            loadedMods = [mods.sablelife]
            gameDirectory = file('runs/client')
            programArguments.addAll '--width', '1280', '--height', '720'
        }
        server {
            server()
            loadedMods = [mods.sablelife]
            gameDirectory = file('runs/server')
            programArgument '--nogui'
        }
        panelPreview {
            client()
            sourceSet = sourceSets.gameTest
            loadedMods = [mods.sablelife, mods.sablelife_tests]
            gameDirectory = file('runs/panel-preview')
            systemProperty 'sablelife.panelPreview', 'true'
            programArguments.addAll '--width', '1280', '--height', '720'
        }
        soundTimelinePreview {
            client()
            sourceSet = sourceSets.gameTest
            loadedMods = [mods.sablelife, mods.sablelife_tests]
            gameDirectory = file('runs/sound-preview')
            systemProperty 'sablelife.soundPreview', 'true'
            programArguments.addAll '--width', '1280', '--height', '720'
        }
        modulePickerPreview {
            client()
            sourceSet = sourceSets.gameTest
            loadedMods = [mods.sablelife, mods.sablelife_tests]
            gameDirectory = file('runs/module-picker-preview')
            systemProperty 'sablelife.pickerPreview', 'true'
            programArguments.addAll '--width', '1280', '--height', '720'
        }
        languagePreview {
            client()
            sourceSet = sourceSets.gameTest
            loadedMods = [mods.sablelife, mods.sablelife_tests]
