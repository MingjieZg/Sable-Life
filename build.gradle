            loadedMods = [mods.sablelife, mods.sablelife_tests]
            gameDirectory = file(providers.gradleProperty('gameTestDirectory').getOrElse('runs/gametest'))
            systemProperty 'sablelife.localGameTests', 'true'
            if(providers.gradleProperty('dragonReplayTests').getOrElse('false')=='true') systemProperty 'sablelife.dragonReplayTemplate', file('.dev/dragon-template.nbt').absolutePath
            if(providers.gradleProperty('arenaAddonTests').getOrElse('false')=='true') systemProperty 'sablelife.arenaReplayTemplate', file('.dev/arena-replay/template.nbt').absolutePath
